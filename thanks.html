<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>送信完了 | UEBAKO Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Kosugi Maru", sans-serif;
        background: #f9f6f1;
        color: #5f7f95;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .card {
        max-width: 520px;
        width: 100%;
        background: #fff;
        border-radius: 24px;
        padding: 48px 36px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      }

      .icon {
        font-size: 64px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 2.5rem);
        margin-bottom: 20px;
        color: #7a6256;
      }

      p {
        line-height: 1.9;
        color: #666;
        margin-bottom: 40px;
      }

      .button {
        display: inline-block;
        padding: 14px 36px;
        background: #5f7f95;
        color: white;
        text-decoration: none;
        border-radius: 999px;
        transition: 0.25s;
      }

      .button:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="icon">✉️</div>

      <h1>Thank You!</h1>

      <p>
        お問い合わせありがとうございます。<br />
        内容を確認のうえ、折り返しご連絡いたします。<br /><br />
        数日経っても返信がない場合は、<br />
        お手数ですが再度お問い合わせください。
      </p>

      <a class="button" href="index.html"> Portfolioへ戻る </a>
    </div>
  </body>
</html>
